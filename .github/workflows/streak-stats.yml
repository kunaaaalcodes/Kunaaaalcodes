name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: DenverCoder1/github-readme-streak-stats@main
        id: streak
        with:
          token: ${{ github.token }}
          options: "user=Kunaaaalcodes&theme=github-dark-blue&hide_border=true&background=0d1117&ring=0071e3&fire=0071e3&currStreakLabel=0071e3"
          path: "./streak-stats.svg"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
